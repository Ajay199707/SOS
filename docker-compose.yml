version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: sos_dev
      POSTGRES_DB: sos_guardian
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["4000:4000"]
    depends_on: [postgres]
volumes:
  pgdata:
